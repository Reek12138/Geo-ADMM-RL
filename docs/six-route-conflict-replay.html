<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>六航路冲突消解回放 · Geo-ADMM-RL</title>
<style>
:root{color-scheme:light;--ink:#142b3b;--muted:#536980;--line:#d7e2eb;--sea:#0b2634;--success:#075544;--red:#a73122;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:#ecf3f8;color:var(--ink);font:15px/1.55 "Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:1280px;margin:auto;padding:34px clamp(14px,3.5vw,48px) 32px}
h1,h2,p,figure{margin:0}
header{margin-bottom:22px}
.eyebrow{font-size:.79rem;font-weight:740;color:#24675e;letter-spacing:.07em}
h1{margin-top:4px;font-size:clamp(25px,4.2vw,44px);line-height:1.22;letter-spacing:-.035em}
.intro{margin-top:10px;color:var(--muted);max-width:82ch}
.toolbar,.timeline,.height-panel{background:var(--paper);border:1px solid var(--line)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:13px 13px 0 0}
button,select,input{font:inherit}
button,select{color:var(--ink);background:#fff;border:1px solid #b8cbdb;border-radius:7px;min-height:38px;padding:6px 11px;font-weight:650}
button{cursor:pointer}
button:hover{background:#e8f2fa}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2a79b0;outline-offset:2px}
#play{min-width:80px;color:white;background:#174f68;border-color:#174f68}
#play:hover{background:#0c3b51}
.speed,.others{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.speed{margin-left:auto}
.others{padding:4px 0}
.others input{width:16px;height:16px;accent-color:#174f68}
.timeline{border-radius:0 0 13px 13px;border-top:0;padding:10px 14px 8px}
.time-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.time-row label{color:var(--muted);font-weight:650}
output{font-variant-numeric:tabular-nums;color:#153f58;font-weight:750}
.scrubber{position:relative;margin:4px 0 0}
#seek{display:block;width:100%;margin:0;height:24px;accent-color:#1c687b;position:relative;z-index:1;background:transparent}
.markers{position:absolute;left:7px;right:7px;top:0;bottom:0;pointer-events:none}
.marker{position:absolute;top:3px;height:18px;border-left:2px solid #24796a;opacity:.75}
.marker.contact{border-color:#c74735}
.tick-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:.79rem;font-variant-numeric:tabular-nums}
#phase{min-height:1.55em;margin-top:8px;color:var(--ink);font-weight:620}
.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:13px}
.map-panel{min-width:0;overflow:hidden;background:var(--sea);border-radius:12px;color:#eaf6fb}
.map-head{display:flex;align-items:start;justify-content:space-between;gap:5px;padding:11px 13px 8px}
.map-head h2{font-size:1rem;line-height:1.35}
.map-head p{color:#aec6d2;font-size:.78rem}
.result{color:#f9ccbc;font-size:.87rem;font-weight:730;text-align:right;white-space:nowrap}
.result.good{color:#8ae2b9}
.map-panel canvas{display:block;width:100%;height:clamp(275px,34vw,395px)}
.map-foot{color:#d0e3ed;min-height:28px;padding:2px 12px 6px;font-size:.82rem;font-variant-numeric:tabular-nums}
.height-panel{margin-top:13px;padding:12px 13px 7px;border-radius:12px}
.height-title{display:flex;flex-wrap:wrap;justify-content:space-between;gap:5px;align-items:center}
.height-title h2{font-size:1rem}
.legend{display:flex;column-gap:14px;row-gap:4px;flex-wrap:wrap;font-size:.81rem;color:var(--muted)}
.glyph{display:inline-block;width:16px;margin-right:5px;border-top:3px solid #136eac;vertical-align:middle}
.glyph.b{border-color:#8b4ab4}.glyph.dotted{border-top:2px dashed #556478}.glyph.solid{border-top:2px solid #556478}
#height{display:block;width:100%;height:188px}
.readouts{display:flex;gap:7px 18px;flex-wrap:wrap;font-size:.85rem;color:#3e5364;font-variant-numeric:tabular-nums}
footer{margin-top:12px;color:var(--muted);font-size:.8rem}
@media(max-width:760px){.comparison{grid-template-columns:1fr}.map-panel canvas{height:300px}.speed{margin-left:0}}
@media(max-width:430px){main{padding:14px 10px}.map-panel canvas{height:265px}button,select{min-height:43px}.result{font-size:.78rem}}
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">GEO-ADMM-RL / 原生 BLUESKY</p>
    <h1>六航路交叉避让回放</h1>
    <p class="intro">开发种子 66313，12 架飞机，物理步长 0.05 s。两侧使用同一来流和入场策略。右侧在一个控制周期调整 AC06、AC08 的高度和 AC11 的速度，随后恢复由策略闭环控制。</p>
  </header>
  <section aria-label="回放控制">
    <div class="toolbar">
      <button type="button" id="play">播放</button>
      <button type="button" id="atChange">跳到改令</button>
      <button type="button" id="atContact">跳到原接触</button>
      <button type="button" id="window" aria-pressed="false">完整航程</button>
      <label class="speed" for="speed">播放速度
        <select id="speed"><option value="2">2×</option><option value="4">4×</option><option value="8" selected>8×</option><option value="16">16×</option><option value="32">32×</option></select>
      </label>
      <label class="others"><input type="checkbox" id="others" checked>显示其他飞机</label>
    </div>
    <div class="timeline">
      <div class="time-row"><label for="seek">仿真时间</label><output id="clock" for="seek"></output></div>
      <div class="scrubber"><div class="markers" aria-hidden="true"><span id="changeMarker" class="marker"></span><span id="contactMarker" class="marker contact"></span></div><input id="seek" type="range" step="0.05"></div>
      <div class="tick-labels"><span id="leftTime"></span><span id="rightTime"></span></div>
      <p id="phase" aria-live="polite"></p>
    </div>
  </section>
  <section class="comparison" aria-label="同步平面航迹对照">
    <figure class="map-panel">
      <figcaption class="map-head"><div><h2>原策略闭环</h2><p>东向与北向距离 · km</p></div><strong class="result" id="baselineResult"></strong></figcaption>
      <canvas id="mapA" role="img" aria-label="原策略各飞机俯视航迹"></canvas>
      <p class="map-foot" id="pairA"></p>
    </figure>
    <figure class="map-panel">
      <figcaption class="map-head"><div><h2>改动一个控制周期</h2><p>东向与北向距离 · km</p></div><strong class="result good" id="interventionResult"></strong></figcaption>
      <canvas id="mapB" role="img" aria-label="介入后三架飞机与邻机的俯视航迹"></canvas>
      <p class="map-foot" id="pairB"></p>
    </figure>
  </section>
  <figure class="height-panel">
    <figcaption class="height-title"><h2>AC06 与 AC08 的实际高度</h2><div class="legend">
      <span><i class="glyph"></i>AC06</span><span><i class="glyph b"></i>AC08</span><span><i class="glyph dotted"></i>原策略</span><span><i class="glyph solid"></i>改令后</span>
    </div></figcaption>
    <canvas id="height" role="img" aria-label="两架关键飞机在两次复放中的实际高度曲线"></canvas>
    <div class="readouts"><span id="commands"></span><span id="speed11"></span></div>
  </figure>
  <footer id="source">两侧共用距离比例尺。接触时刻取原生逐帧判定，航迹点按 0.5–2 s 采样并在播放时插值。本页展示单个开发反事实。</footer>
</main>

    const stride=altBounds[1]-altBounds[0]>700?300:100;
    for(let z=altBounds[0];z<=altBounds[1];z+=stride) {
      const y=ty(z); c.beginPath();c.moveTo(margin.left,y);c.lineTo(w-margin.right,y);c.stroke();
      c.fillText(String(z),9,y+4);
    }
    c.fillText("ft",11,11);
    for(const [t,label,col] of [[change,"改令","#24796a"],[hit,"原接触","#a73122"]]){
      if(t<start||t>stop) continue;
      c.strokeStyle=col;c.globalAlpha=.5;c.setLineDash([3,4]);
      c.beginPath();c.moveTo(tx(t),margin.top);c.lineTo(tx(t),h-margin.bottom);c.stroke();
      c.setLineDash([]);c.globalAlpha=1;
      if(tx(hit)-tx(change)>47){c.fillStyle=col;c.fillText(label,tx(t)+4,12);}
    }
    c.save();c.beginPath();c.rect(margin.left,margin.top,w-margin.left-margin.right,h-margin.top-margin.bottom);c.clip();
    for(const [run,dashed] of [[baseline,true],[revised,false]]){
      for(const [slot,col] of [[6,"#136eac"],[8,"#8b4ab4"]]){
        c.strokeStyle=col;c.lineWidth=dashed?1.7:2.4;c.globalAlpha=dashed?.65:.95;
        c.setLineDash(dashed?[5,4]:[]);
        path(c,pointsInView(run.tracks[slot],run.dt),p=>tx(p[0]*run.dt),p=>ty(p[3]));
        const point=sample(run.tracks[slot],now,run.dt);
        if(point){c.setLineDash([]);c.beginPath();c.arc(tx(now),ty(point[3]),3,0,2*Math.PI);c.fillStyle=col;c.fill();}
      }
    }
    c.globalAlpha=.55;c.strokeStyle="#203a51";c.lineWidth=1;c.setLineDash([]);
    c.beginPath();c.moveTo(tx(now),margin.top);c.lineTo(tx(now),h-margin.bottom);c.stroke();
    c.restore();c.fillStyle="#536980";c.fillText(time(start),margin.left,h-5);
    const final=time(stop);c.fillText(final,w-margin.right-c.measureText(final).width,h-5);
  }
  function draw(){
    seek.value=String(now);
    $("clock").textContent=time(now);
    const update=now<change?"两侧仍在同一轨迹上":now<hit?"右侧已执行分层与减速":now<stop?"原策略侧出现接触，右侧维持独立闭环":"本段回放结束";
    if($("phase").textContent!==update) $("phase").textContent=update;
    map($("mapA"),baseline,$("pairA"),true);
    map($("mapB"),revised,$("pairB"),false);
    height();
    const at=[baseline,revised].map(run=>sample(run.tracks[11],now,run.dt));
    $("speed11").textContent=at.every(Boolean)?"AC11 当前空速 "+at[0][5].toFixed(1)+" / "+at[1][5].toFixed(1)+" kt（原策略 / 改令）":"";
  }
  function seekTo(t){now=Math.max(start,Math.min(stop,t));draw();}
  function playState(state){
    playing=state;before=0;
    $("play").textContent=playing?"暂停":"播放";
    if(!state && timestamp){cancelAnimationFrame(timestamp);timestamp=0;}
    if(state) timestamp=requestAnimationFrame(step);
  }
  function step(ms){
    if(!playing) return;
    if(before) now=Math.min(stop,now+(ms-before)*Number($("speed").value)/1000);
    before=ms; draw();
    if(now>=stop) playState(false);
    else timestamp=requestAnimationFrame(step);
  }
  function setWindow(){
    start=full?0:Math.max(0,change-39);stop=full?end:Math.min(end,hit+61);
    seek.min=String(start);seek.max=String(stop);
    $("leftTime").textContent=time(start);$("rightTime").textContent=time(stop);
    $("changeMarker").style.left=((change-start)/(stop-start)*100)+"%";
    $("contactMarker").style.left=((hit-start)/(stop-start)*100)+"%";
    $("window").textContent=full?"回到冲突窗口":"完整航程";
    $("window").setAttribute("aria-pressed",String(full));
    range();seekTo(now);
  }
  seek.addEventListener("input",()=>{playState(false);seekTo(Number(seek.value));});
  $("play").addEventListener("click",()=>{if(!playing&&now>=stop)seekTo(start); playState(!playing);});
  $("atChange").addEventListener("click",()=>{playState(false);seekTo(change);});
  $("atContact").addEventListener("click",()=>{playState(false);seekTo(hit);});
  $("window").addEventListener("click",()=>{playState(false);full=!full;setWindow();});
  $("others").addEventListener("change",draw);
  const u=revised.commands;
  const signed=(n,places)=>(n>=0?"+":"−")+Math.abs(n).toFixed(places);
  $("commands").textContent="改令 "+time(change)+"  ·  AC06 "+signed(u[6].normalized[1]*300,0)+" ft  ·  AC08 "+signed(u[8].normalized[1]*300,0)+" ft  ·  AC11 "+signed(u[11].normalized[0]*4.5,1)+" kt";
  setWindow();
  if(typeof ResizeObserver==="function"){
    const resize=new ResizeObserver(draw); for(const id of ["mapA","mapB","height"]) resize.observe($(id));
  }else{window.addEventListener("resize",draw);}
})();
</script>
</body>
</html>
